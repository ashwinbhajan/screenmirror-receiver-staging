<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Screen Mirror</title>
    <link rel="stylesheet" href="./styles.css?rev=connected-state-idle-return-20261103-01&amp;build=stg-20261125-13" />
    <script>window.__screenMirrorPageScriptStarted = performance.now();</script>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script src="./receiver.js?rev=connected-state-idle-return-20261103-01&amp;diag=cmaf-startup-1&amp;vis=20261124-01&amp;build=stg-20261125-13" defer></script>
  </head>
  <body class="receiver-waiting">
    <video id="probe-video" muted playsinline autoplay aria-hidden="true"></video>
    <main id="idle-screen" class="receiver-status">
      <div class="brand" aria-hidden="true">Screen Mirror</div>
      <div id="status-content" class="status-content">
        <div class="casting-visual" aria-hidden="true">
          <img src="./assets/screen-mirror-app-icon.png?rev=connected-state-idle-return-20261103-01&amp;build=stg-20261125-13" alt="Screen Mirror" />
        </div>
        <div id="phone-chip" class="phone-chip" hidden><span class="chip-dot"></span><span id="phone-chip-text">iPhone connected</span></div>
        <div role="status" aria-live="polite" aria-atomic="true">
          <h1 id="status-title">Ready to Cast</h1>
          <p id="status-detail">On your iPhone, open Screen Mirror and tap Cast to TV.</p>
        </div>
        <ol id="status-steps" class="status-steps">
          <li><span>1</span><span id="status-step-1">Connect your iPhone to the same Wi‑Fi as this TV</span></li>
          <li><span>2</span><span id="status-step-2">Open Screen Mirror on your iPhone</span></li>
          <li><span>3</span><span id="status-step-3">Tap Cast to TV</span></li>
        </ol>
        <div class="waiting-indicator" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </main>
    <div id="stall-badge" class="stall-badge" role="status" aria-live="polite" hidden>
      <span class="stall-spinner" aria-hidden="true"></span><span class="pause-icon" aria-hidden="true"></span><span id="stall-badge-text">Reconnecting…</span>
    </div>
    <!-- Photos, videos and video links from the iPhone (hidden until one is sent). -->
    <cast-media-player id="media-player"></cast-media-player>
    <!-- Screen Mirror Cast receiver (staging copy of production /v2). -->
  </body>
</html>
