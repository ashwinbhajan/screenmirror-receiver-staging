name: receiver-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node -e "new (require('vm').Script)(require('fs').readFileSync('v2/receiver.js','utf8'))"
      - run: npm test
